<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Strict CSP (ultraplan.html, security requirements). No external scripts, no inline scripts.
      vite.config.ts appends the sidecar origin to connect-src at build time, and in dev only it
      adds the HMR websocket sources and 'unsafe-inline' for the styles Vite injects.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Orugas</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="world" aria-label="Orugas world"></canvas>
      <canvas id="hud" aria-hidden="true"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
